<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guild members · Jawbreakers</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <main>
    <h1>Guild members</h1>
    <p class="lead">Pick a class to see its characters. A character opens its page on the Armory.</p>
    <div class="armory-bar">
      <button class="btn" id="armory-btn" type="button" disabled>Update from the Armory</button>
      <span class="muted small" id="armory-status" role="status"></span>
    </div>
    <div id="armory-result" class="panel armory-result" hidden></div>
    <hr class="rule">
    <div id="classes" class="class-tiles"></div>

    <dialog id="class-window" class="class-window" aria-labelledby="window-title">
      <header>
        <img id="window-icon" alt="" width="40" height="40">
        <div>
          <h2 id="window-title"></h2>
          <span class="muted small" id="window-count"></span>
        </div>
        <button class="btn quiet small" id="window-close" type="button">Close</button>
      </header>
      <ul id="window-list"></ul>
    </dialog>
    <p id="error" class="msg error"></p>
  </main>

  <script src="js/common.js"></script>
  <script>
    let isAdmin = false, skills = [];

    const classIcon = cls => `https://wow.zamimg.com/images/wow/icons/large/classicon_${cls.toLowerCase()}.jpg`;
    const win = document.getElementById('class-window');
    let openClass = null, byClass = new Map();

    // Admin only: a description box under the character.
    function descriptionEditor(c, text) {
      const box = el('textarea', { maxlength: 2000, 'aria-label': `Description of ${c.name}` });
      box.value = c.description;
      const msg = el('span', { class: 'msg', role: 'status' });
      return el('details', { class: 'char-edit' }, el('summary', { text: 'Edit description' }), el('form', {
        onsubmit: async e => {
          e.preventDefault();
          try {
            const saved = await api(`characters/${c.id}/description`, 'PUT', { description: box.value });
            c.description = saved.description;
            text.textContent = saved.description;
            text.hidden = !saved.description;
            msg.className = 'msg'; msg.textContent = 'Saved.';
          } catch (err) { msg.className = 'msg error'; msg.textContent = err.message; }
        }
      }, box, el('div', { class: 'actions', style: 'margin-top:.5rem' }, el('button', { class: 'btn small', text: 'Save description' }), msg)));
    }

    // One character in the window. The whole row is a link to its Armory page (characters below level 10 have none).
    function characterItem(c) {
      const mine = skills.filter(s => s.characterId === c.id).sort((a, b) => b.skill - a.skill);
      const text = el('span', { class: 'desc', text: c.description, hidden: !c.description });
      const body = [
        el('span', { class: 'top' },
          el('span', { class: 'name', text: c.name }),
          el('span', { class: 'meta', text: `Level ${c.level} ${c.race}`.trim() }),
          el('span', { class: 'go', text: c.armoryUrl ? 'Armory ↗' : 'No Armory page yet' })),
        mine.length > 0 && el('span', { class: 'profs', text: mine.map(s => `${s.profession} ${s.skill}`).join(' · ') }),
        text];
      return el('li', {},
        c.armoryUrl
          ? el('a', { class: 'char-card', href: c.armoryUrl, target: '_blank', rel: 'noopener', 'aria-label': `${c.name}, level ${c.level}: open the Armory page` }, body)
          : el('div', { class: 'char-card none' }, body),
        isAdmin && descriptionEditor(c, text));
    }

    function showClass(cls) {
      openClass = cls;
      const mine = byClass.get(cls) || [];
      win.style.setProperty('--class', CLASS_COLORS[cls] || 'var(--gold)');
      document.getElementById('window-icon').src = classIcon(cls);
      document.getElementById('window-title').textContent = cls;
      document.getElementById('window-count').textContent = mine.length === 1 ? '1 character' : `${mine.length} characters`;
      document.getElementById('window-list').replaceChildren(...(mine.length ? mine.map(characterItem) : [el('li', { class: 'muted', text: 'No characters of this class yet.' })]));
      if (!win.open) win.showModal();
    }

    document.getElementById('window-close').addEventListener('click', () => win.close());
    // A click on the dark area around the window closes it
    win.addEventListener('click', e => { if (e.target === win) win.close(); });
    win.addEventListener('close', () => { openClass = null; });

    async function loadMembers() {
      const [meta, characters, crafting] = await Promise.all([metaPromise, api('characters'), api('crafting')]);
      isAdmin = meta.admin;
      skills = crafting.skills;
      byClass = new Map(meta.classes.map(cls => [cls, characters.filter(c => c.class === cls)]));
      document.getElementById('classes').replaceChildren(...meta.classes.map(cls => {
        const mine = byClass.get(cls);
        return el('button', { class: 'class-tile', type: 'button', style: `--class:${CLASS_COLORS[cls] || 'var(--gold)'}`, 'aria-haspopup': 'dialog', onclick: () => showClass(cls) },
          el('img', { src: classIcon(cls), alt: '', width: 56, height: 56 }),
          el('span', { class: 'label' },
            el('span', { class: 'name', text: cls }),
            el('span', { class: 'count', text: mine.length === 0 ? 'No characters yet' : mine.length === 1 ? '1 character' : `${mine.length} characters` }),
            mine.length > 0 && el('span', { class: 'levels', text: `Highest level ${Math.max(...mine.map(c => c.level))}` })));
      }));
      if (openClass) showClass(openClass); // keep the open window in step after an update
    }
    loadMembers().catch(err => { document.getElementById('error').textContent = err.message; });

    // ---- Update from the Armory: anyone can press it, the server allows it once an hour ----
    const armoryBtn = document.getElementById('armory-btn'), armoryStatus = document.getElementById('armory-status');
    let armoryReadyAt = 0, armoryLast = null, armoryBusy = false;

    function showArmoryState(state) {
      armoryLast = state.lastUpdate ? new Date(state.lastUpdate) : null;
      armoryReadyAt = Date.now() + state.secondsLeft * 1000; // counted from now, so a wrong clock on this device doesn't matter
      tickArmory();
    }

    function tickArmory() {
      if (armoryBusy) return;
      const minutes = Math.ceil((armoryReadyAt - Date.now()) / 60000);
      armoryBtn.disabled = minutes > 0;
      const last = armoryLast
        ? `Last updated ${armoryLast.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}.`
        : 'Not updated yet.';
      armoryStatus.textContent = minutes > 0 ? `${last} Can be updated again in ${minutes} min.` : last;
    }
    setInterval(tickArmory, 15000);

    function showArmoryResult(r) {
      const lines = [];
      if (r.error) lines.push(el('p', { class: 'msg error', text: r.error }));
      else if (r.joined?.length) lines.push(el('p', { text: `New in the guild: ${r.joined.join(', ')}.` }));
      if (r.removed?.length) lines.push(el('p', { text: `Left the guild and removed: ${r.removed.join(', ')}.` }));
      if (r.error) { /* nothing more to tell */ }
      else if (r.changes.length === 0) lines.push(el('p', { text: `Checked ${r.checked} characters: nothing has changed.` }));
      else lines.push(el('p', { text: `Checked ${r.checked} characters, ${r.changes.length} changed:` }), el('ul', {}, r.changes.map(t => el('li', { text: t }))));
      if (r.leftGuild.length) lines.push(el('p', { text: `No longer in the guild according to the Armory: ${r.leftGuild.join(', ')}. An admin can remove them.` }));
      if (r.noPage.length) lines.push(el('p', { class: 'muted', text: `No Armory page (below level 10): ${r.noPage.join(', ')}.` }));
      if (r.failed.length) lines.push(el('p', { class: 'msg error', text: `Could not be read this time: ${r.failed.join(', ')}.` }));
      const box = document.getElementById('armory-result');
      box.replaceChildren(...lines);
      box.hidden = false;
    }

    armoryBtn.addEventListener('click', async () => {
      armoryBusy = true;
      armoryBtn.disabled = true;
      armoryStatus.textContent = 'Reading the Armory, this takes a little while…';
      try {
        const state = await api('armory/update', 'POST');
        showArmoryResult(state.result);
        await loadMembers();
        armoryBusy = false;
        showArmoryState(state);
      } catch (err) {
        armoryBusy = false;
        // Most likely someone else updated in the meantime: show when it can be done again
        await api('armory').then(showArmoryState).catch(() => {});
        armoryStatus.textContent = `${err.message} ${armoryStatus.textContent}`;
      }
    });

    api('armory').then(showArmoryState).catch(() => { armoryStatus.textContent = ''; });
  </script>
</body>
</html>
